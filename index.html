<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Cat Laughs</title>
<style>
  /* A closed gift on black; one tap opens it, shows the cat and starts the laugh on loop. */
  :root{--ground:#0b0b0b;--box:#ff6469;--lid:#e0494f;--ribbon:#e9e2cf;--ink:#0b0b0b;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--ground);color:var(--ribbon);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
  main{display:grid;justify-items:center;gap:28px;padding:16px}
  .stage{display:grid;width:min(78vmin,420px);aspect-ratio:1}
  .stage > *{grid-area:1/1;width:100%;height:100%}
  #gift{transition:opacity .35s ease .25s,transform .35s ease .25s}
  #gift .lid{transform-box:fill-box;transform-origin:center bottom;transition:transform .55s cubic-bezier(.3,1.5,.5,1),opacity .4s ease .15s}
  #reveal{object-fit:contain;opacity:0;transform:scale(.7);transition:opacity .5s ease .45s,transform .6s cubic-bezier(.3,1.5,.5,1) .45s;visibility:hidden}
  #open{appearance:none;border:0;cursor:pointer;background:var(--ribbon);color:var(--ink);font:600 15px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:16px 30px;min-height:48px;border-radius:2px;transition:opacity .25s ease,transform .1s ease}
  #open:active{transform:scale(.97)}
  #open:focus-visible{outline:3px solid var(--box);outline-offset:3px}
  .opened #open{opacity:0;pointer-events:none}
  .opened #gift{opacity:0;transform:scale(.9)}
  .opened #gift .lid{transform:translateY(-70px) rotate(-16deg);opacity:0}
  .opened #reveal{visibility:visible;opacity:1;transform:scale(1)}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;transition-delay:0s!important}}
</style>
</head>
